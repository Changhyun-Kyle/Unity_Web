<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>앱 열기</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }
        
        body {
            background: #222222;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 20px;
        }
        
        .container {
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(205, 255, 98, 0.2);
        }
        
        .logo {
            width: 80px;
            height: 80px;
            background-color: #222222;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            border: 2px solid #CDFF62;
        }
        
        .logo svg {
            width: 50px;
            height: 50px;
        }
        
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }
        
        p {
            font-size: 16px;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .loader {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(205, 255, 98, 0.2);
            border-radius: 50%;
            border-top-color: #CDFF62;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }
        
        .store-buttons {
            display: none;
            margin-top: 30px;
        }
        
        .btn {
            background-color: #CDFF62;
            color: #222222;
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
            display: inline-block;
            text-decoration: none;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(205, 255, 98, 0.4);
            background-color: #d8ff7e;
        }
        
        .android-btn, .ios-btn {
            display: none;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .fadeIn {
            animation: fadeIn 0.5s ease-in-out forwards;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px;
            }
            
            h1 {
                font-size: 20px;
            }
            
            p {
                font-size: 14px;
            }
            
            .btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
    </style>
    <script>
        function getDeviceType() {
            const userAgent = navigator.userAgent;
            if (/android/i.test(userAgent)) {
                return 'android';
            } else if (/iphone|ipad|ipod|macintosh.*mac os x/i.test(userAgent)) {
                return 'ios';
            } else {
                return 'unknown';
            }
        }
        
        function redirectToStore() {
            const androidPackageName = 'com.agspace.trkit&hl=ko';
            const androidStoreLink = 'https://play.google.com/store/apps/details?id=' + androidPackageName;
            const iosAppStoreLink = 'https://apps.apple.com/app/1627691040';
            const appUrlScheme = 'wyft://invite?';
            const deviceType = getDeviceType();

            // 앱 실행 시도
            window.location.href = appUrlScheme;
        
            // 2.5초 후에도 페이지에 남아있으면 앱이 설치되지 않은 것으로 간주
            const storeRedirectTimeout = setTimeout(() => {
                document.querySelector('.loader-container').style.display = 'none';
                document.querySelector('.store-buttons').style.display = 'block';
                document.querySelector('.store-buttons').classList.add('fadeIn');
        
                if (deviceType === 'android') {
                    document.getElementById('android-link').href = androidStoreLink;
                } else if (deviceType === 'ios') {
                    document.getElementById('ios-link').href = iosAppStoreLink;
                } else {
                    document.getElementById('android-link').href = androidStoreLink;
                    document.getElementById('ios-link').href = iosAppStoreLink;
                }
            }, 2500);
        
            // 앱이 열려 페이지가 background로 가면 타이머 중단
            document.addEventListener('visibilitychange', () => {
                if (document.hidden) {
                    clearTimeout(storeRedirectTimeout);
                }
            });
        }       
        window.onload = function() {
            setTimeout(redirectToStore, 1000);
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="#CDFF62">
                <path d="M12,2C6.48,2,2,6.48,2,12c0,5.52,4.48,10,10,10s10-4.48,10-10C22,6.48,17.52,2,12,2z M13,17h-2v-6h2V17z M13,9h-2V7h2V9z"/>
            </svg>
        </div>
        <h1>앱으로 이동 중입니다</h1>
        <p>앱이 설치되어 있으면 자동으로 열립니다. 아직 설치하지 않으셨다면 스토어로 이동됩니다.</p>
        
        <div class="loader-container">
            <div class="loader"></div>
            <p>잠시만 기다려주세요...</p>
        </div>
        
        <div class="store-buttons">
            <p>앱이 자동으로 열리지 않나요?</p>
            <a id="android-link" href="#" class="btn android-btn">
                Google Play에서 다운로드
            </a>
            <a id="ios-link" href="#" class="btn ios-btn">
                App Store에서 다운로드
            </a>
        </div>
    </div>
</body>
</html>
