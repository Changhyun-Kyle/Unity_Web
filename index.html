<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>wyft 초대하기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }

    body {
      background: #222;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      max-width: 500px;
      width: 90%;
      border: 1px solid rgba(205, 255, 98, 0.2);
    }

    .logo {
      width: 80px;
      height: 80px;
      background-color: #222;
      border-radius: 20px;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      border: 2px solid #CDFF62;
    }

    .logo svg {
      width: 50px;
      height: 50px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    p {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .loader {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(205, 255, 98, 0.2);
      border-top: 3px solid #CDFF62;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    .store-buttons {
      display: none;
      margin-top: 30px;
    }

    .btn {
      background: #CDFF62;
      color: #222;
      border: none;
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      margin: 10px;
      display: inline-block;
    }

    .btn:hover {
      background-color: #d8ff7e;
      box-shadow: 0 0 10px rgba(205, 255, 98, 0.3);
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .fadeIn {
      animation: fadeIn 0.4s ease-in-out forwards;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
  <script>
    function tryOpenAppWithFallback() {
      const userLang = navigator.language || navigator.userLanguage;
      const countryCode = userLang.split('-')[1]?.toLowerCase() || 'kr';
    
      const appUrlScheme = 'wyft://invite?ref=landing';
      const androidStoreLink = `https://play.google.com/store/apps/details?id=com.agspace.trkit&hl=${countryCode}&gl=${countryCode.toUpperCase()}`;
      const iosAppStoreLink = `https://apps.apple.com/${countryCode}/app/id1627691040`;
    
      const userAgent = navigator.userAgent;
      const isAndroid = /android/i.test(userAgent);
      const isIOS = /iphone|ipad|ipod|macintosh.*mac os x/i.test(userAgent);
      const storeUrl = isAndroid ? androidStoreLink : isIOS ? iosAppStoreLink : 'https://yourfallback.url';
    
      // 앱 열기 시도
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = appUrlScheme;
      document.body.appendChild(iframe);
    
      // fallback 타이머
      const fallbackTimeout = setTimeout(() => {
        // fallback 직접 실행
        window.location.href = storeUrl;
      }, 2500);
    
      // 앱 실행되어 페이지가 숨겨지면 fallback 취소
      const visibilityHandler = () => {
        if (document.hidden) {
          clearTimeout(fallbackTimeout);
          document.removeEventListener('visibilitychange', visibilityHandler);
        }
      };
      document.addEventListener('visibilitychange', visibilityHandler);
    }


    window.onload = function () {
      setTimeout(tryOpenAppWithFallback, 500);
    };
  </script>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="#CDFF62">
        <path
          d="M12,2C6.48,2,2,6.48,2,12c0,5.52,4.48,10,10,10s10-4.48,10-10C22,6.48,17.52,2,12,2z M13,17h-2v-6h2V17z M13,9h-2V7h2V9z"
        />
      </svg>
    </div>
    <h1>앱으로 이동 중입니다</h1>
    <p>앱이 설치되어 있으면 자동으로 열립니다. 아직 설치하지 않으셨다면 스토어로 안내됩니다.</p>

    <div class="loader"></div>

    <div class="store-buttons">
      <p>앱이 자동으로 열리지 않나요?</p>
      <a id="android-link" href="#" class="btn">Google Play에서 다운로드</a>
      <a id="ios-link" href="#" class="btn">App Store에서 다운로드</a>
    </div>
  </div>
</body>
</html>
